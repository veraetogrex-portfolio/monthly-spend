<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Monthly Spend — veraetogrex_portfolio</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- Monthly Spend · zero dependencies · github.com/veraetogrex-portfolio -->
  <section class="ms" id="spend" aria-label="Card spending by month">
    <header class="ms-top">
      <p class="ms-brand"><b>VECTOR</b><span>Card spending</span></p>
      <div class="ms-months" role="radiogroup" aria-label="Month">
        <button class="ms-month" role="radio" data-m="1">Sep</button>
        <button class="ms-month" role="radio" data-m="2">Oct</button>
        <button class="ms-month" role="radio" data-m="3">Nov</button>
        <span class="ms-month-pill" aria-hidden="true"></span>
      </div>
    </header>

    <div class="ms-head">
      <div>
        <p class="ms-label">Spent in October</p>
        <p class="ms-total" aria-live="polite">$1,240</p>
      </div>
      <button class="ms-back" tabindex="-1"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M14.5 5.5 8 12l6.5 6.5"/></svg>All categories</button>
    </div>

    <!-- one pocket per category, as wide as its share of the month; its receipts are tucked inside -->
    <div class="ms-ribbon" role="list" aria-label="Categories"></div>
  </section>

  <script src="script.js"></script>
</body>
</html>
